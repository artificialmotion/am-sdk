[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "am-sdk"
version = "0.1.0"
description = "Host SDK for Artificial Motion joints: control API, simulator, EtherCAT and CAN-FD backends"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Artificial Motion"}]
keywords = ["robotics", "actuator", "humanoid", "ethercat", "can-fd", "cia402", "simulation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
]
dependencies = []

[project.optional-dependencies]
can = ["python-can>=4.3"]
ecat = ["pysoem>=1.1"]
mujoco = ["mujoco>=3.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://artificialmotion.com"
Source = "https://github.com/artificialmotion/am-sdk"

[tool.setuptools.packages.find]
include = ["am_sdk*"]

[tool.setuptools.package-data]
am_sdk = ["data/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
