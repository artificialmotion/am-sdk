[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "am-sdk"
version = "0.2.0"
description = "Host SDK for Artificial Motion joints: control API, simulator, EtherCAT and CAN-FD backends"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Artificial Motion"}]
keywords = ["robotics", "actuator", "humanoid", "ethercat", "can-fd", "cia402", "simulation", "torque-estimation",
            "collision-detection"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Development Status :: 3 - Alpha",
]
dependencies = []

[project.optional-dependencies]
can = ["python-can>=4.3"]
ecat = ["pysoem>=1.1"]
mujoco = ["mujoco>=3.0"]
batch = ["numpy>=1.22"]
pinn = ["numpy>=1.22"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://artificialmotion.com"
Source = "https://github.com/artificialmotion/am-sdk"
Documentation = "https://github.com/artificialmotion/am-sdk/blob/main/docs/API.md"
Changelog = "https://github.com/artificialmotion/am-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/artificialmotion/am-sdk/issues"

[tool.setuptools.packages.find]
include = ["am_sdk*"]

[tool.setuptools.package-data]
am_sdk = ["data/*/*", "estimation/*.json", "actuator_model/*.json", "actuator_model/specs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
