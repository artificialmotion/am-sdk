name: ros2

# ROS 2 packages in ros2/. Separate from ci.yml so the C and Python jobs are unaffected.
#  - standalone: the plugin core and the plugin on mock ROS headers, xacro macros, bridge core. No ROS.
#  - colcon: all four packages built and tested in ros:humble and ros:jazzy containers.
#    Non-blocking (continue-on-error) until it has run green once; this job was written on a machine
#    without ROS 2 and has not run before its first CI run.

on:
  push:
    branches: [main]
    paths: ["ros2/**", "c/**", "python/**", "tools/gen_ros2_xacro.py", ".github/workflows/ros2.yml"]
  pull_request:
    paths: ["ros2/**", "c/**", "python/**", "tools/gen_ros2_xacro.py", ".github/workflows/ros2.yml"]
  workflow_dispatch:

jobs:
  standalone:
    name: ROS-free core and macros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core and mock-header plugin (Werror)
        run: |
          cmake -S ros2/am_ros2_control -B build-ros2 -DAM_ROS2_STANDALONE=ON -DAM_ROS2_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ros2 -j2

      - name: Test core and plugin
        run: ctest --test-dir build-ros2 --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: xacro macros and bridge core
        run: |
          python -m pip install -e "python[dev]" xacro
          python tools/gen_ros2_xacro.py --check
          python -m pytest -v ros2/am_description/test ros2/am_ros2_bridge/test

  colcon:
    name: colcon (${{ matrix.distro }})
    runs-on: ubuntu-latest
    continue-on-error: true
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pip
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths ros2 --ignore-src -y --rosdistro ${{ matrix.distro }}
          python3 -m pip install ./python

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths ros2 --event-handlers console_direct+

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          colcon test --base-paths ros2 --event-handlers console_direct+
          colcon test-result --verbose

      - name: Expand the demo URDF
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          xacro "$(ros2 pkg prefix am_ros2_demo)/share/am_ros2_demo/urdf/am_demo_one_joint.urdf.xacro" unit:=H-X > /tmp/demo.urdf
          check_urdf /tmp/demo.urdf || true
          grep -q "am_ros2_control/AmSystemInterface" /tmp/demo.urdf
